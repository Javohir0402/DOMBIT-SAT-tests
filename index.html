<style>
:root{--bg:#f4f0fb;--card:#fff;--tx:#1f1535;--mu:#6b6285;--pr:#6d28d9;--pr2:#a855f7;--bd:#ddd3f3;--ok:#15803d;--er:#be185d;--sel:rgba(124,58,237,.13);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150f24;--card:#20183a;--tx:#ece6fb;--mu:#a99fc7;--pr:#8b5cf6;--pr2:#c084fc;--bd:#3a2f5e;--ok:#4ade80;--er:#f472b6;--sel:rgba(167,139,250,.2)}}
:root[data-theme="dark"]{--bg:#150f24;--card:#20183a;--tx:#ece6fb;--mu:#a99fc7;--pr:#8b5cf6;--pr2:#c084fc;--bd:#3a2f5e;--ok:#4ade80;--er:#f472b6;--sel:rgba(167,139,250,.2)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 20px;background:linear-gradient(135deg,#4c1d95,#7e22ce 60%,#a855f7);color:#fff}
header .brand{display:flex;align-items:center;gap:10px}header .brand img{height:42px;width:auto;flex:none;display:block}
header select,header button{width:auto;margin:0;padding:5px 9px;background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.4)}header option{color:#000}
main{max-width:1000px;margin:20px auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 2px 10px rgba(109,40,217,.07)}
h2,h3{margin:0 0 10px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0 10px}
textarea{min-height:90px}
button{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;border:0;border-radius:8px;padding:9px 16px;font:inherit;cursor:pointer}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.d{background:var(--er)}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:150px}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}.tabs button{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.tabs button.on{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;border-color:transparent}
.tb{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}.tb button{padding:4px 10px}
.pv{border:1px dashed var(--pr2);border-radius:8px;padding:12px;min-height:60px;font-size:18px}
.ch{display:flex;gap:10px;align-items:center;border:1px solid var(--bd);border-radius:10px;padding:10px 14px;margin:8px 0;cursor:pointer}
.ch.sel{border-color:var(--pr);background:var(--sel)}
.ch b{width:28px;height:28px;border-radius:50%;border:1px solid var(--bd);display:grid;place-items:center;flex:none}
sup,sub{font-size:.7em;line-height:0}
.rt{border-top:1.5px solid currentColor;padding:0 2px;margin-left:1px}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;font-size:.9em}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 4px}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.nav button{padding:4px 10px;background:var(--card);color:var(--tx);border:1px solid var(--bd)}.nav .ans{background:var(--pr);color:#fff}.nav .cur{outline:2px solid var(--pr2)}
.mu{color:var(--mu);font-size:14px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:7px;border-bottom:1px solid var(--bd)}
.tag{background:var(--sel);color:var(--pr);border-radius:20px;padding:1px 9px;font-size:12px}
#cov{position:fixed;inset:0;background:#1a0b33;color:#fff;display:none;place-items:center;text-align:center;z-index:99;padding:20px}
#mod{position:fixed;inset:0;background:rgba(20,8,40,.6);display:none;place-items:center;z-index:120;padding:16px}
.secure{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.secure input{user-select:text}
.dz{display:grid;grid-template-columns:1fr;gap:16px}.dz.on{grid-template-columns:1fr 1fr}@media(max-width:800px){.dz.on{grid-template-columns:1fr}}
.secure #dm *{-webkit-user-select:text;user-select:text}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.mc{border:2px solid var(--pr);border-radius:14px;padding:18px;background:var(--card);cursor:pointer}.mc.off{opacity:.55;border-color:var(--bd);cursor:default}.mc:not(.off):hover{background:var(--sel)}
.rg{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0}.rq{width:48px;height:48px;border:2px dashed var(--pr);border-radius:8px;display:grid;place-items:center;position:relative;cursor:pointer;color:var(--pr);font-weight:700}.rq.a{background:var(--pr);color:#fff;border:2px solid var(--pr)}.rq em{position:absolute;top:-11px;right:-9px;font-style:normal;font-size:15px}
mark{background:#fde047;color:#000;border-radius:3px}#qt,#qt *{-webkit-user-select:text;user-select:text}
.tl{border:2px solid var(--bd);border-radius:12px;padding:12px;cursor:pointer;background:var(--card)}.tl.on{border-color:var(--pr);background:var(--sel)}

let db={users:[],tests:[],results:[]},me=null,tab='tests',T=null,focusEl=null,qTest=null,lastBad=0,eq=null,view=null,refEdit=null,qImg='',rImg='',ue=null,te=null,qSec='english',qMod=1,flash='',SRV=false,TOK='',DC=null,CS=null,stOK=true;
const rnd=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const nm=r=>{const x=db.users.find(u=>u.uid&&u.uid==r.uid);return x?x.id:r.u};
try{db=JSON.parse(localStorage.getItem('satdb'))||db;localStorage.setItem('t','1')}catch(e){stOK=false}
db.users=db.users||[];db.tests=db.tests||[];db.results=db.results||[];
if(!db.users.some(u=>u.role=='admin'))db.users.push({id:'admin',pw:db.adminpw||'admin123',role:'admin'});
db.users.forEach(u=>{u.role=u.role||'student';u.uid=u.uid||rnd()});db.tests.forEach(t=>t.id=t.id||rnd());
const SEED={"id":"mock1","title":"Full Mock Test 1","type":"Full mock test","pw":"1","mods":2,"tEn":32,"tMa":35,"qs":[{"sec":"english","mod":1,"type":"mc","text":"The researcher’s findings were considered ______ because other laboratories repeated her experiment and obtained the same results.\n\nWhich choice completes the text with the most logical and precise word or phrase?","ch":["controversial","unreliable","trustworthy","incomplete"],"ans":2},{"sec":"english","mod":1,"type":"mc","text":"The museum’s newest exhibit ______ rare maps, handwritten letters, and photographs from the nineteenth century.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","ch":["features","feature","have featured","are featuring"],"ans":0},{"sec":"english","mod":1,"type":"mc","text":"Many people assume that cacti grow only in deserts. ______ several species thrive in tropical rainforests, where they grow on tree branches.\n\nWhich choice completes the text with the most logical transition?","ch":["Similarly,","However,","Therefore,","For instance,"],"ans":1},{"sec":"english","mod":1,"type":"mc","text":"Honeybees that find a rich source of nectar return to the hive and perform a “waggle dance.” The angle of the dance relative to vertical shows other bees the direction of the food in relation to the sun, and the length of the dance indicates how far away the food is.\n\nAccording to the text, what does the length of a bee’s waggle dance communicate?","ch":["The quality of the nectar","The direction of the food","The time of day","The distance to the food"],"ans":3},{"sec":"english","mod":2,"type":"mc","text":"Although the new recycling policy was ______ by many residents at first, most came to appreciate its convenience within a few months.\n\nWhich choice completes the text with the most logical and precise word or phrase?","ch":["praised","resisted","drafted","funded"],"ans":1},{"sec":"english","mod":2,"type":"mc","text":"The author, ______ is best known for her nature poetry, published her first novel last year.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","ch":["whom","which","whose","who"],"ans":3},{"sec":"english","mod":2,"type":"mc","text":"Each of the students in the robotics club ______ responsible for maintaining one part of the team’s robot.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","ch":["are","were","is","have been"],"ans":2},{"sec":"english","mod":2,"type":"mc","text":"Researchers compared two groups of students preparing for the same exam. One group studied in several short sessions spread over two weeks; the other studied for the same total time in a single session the night before. A week after the exam, both groups took a surprise follow-up quiz, and the first group scored substantially higher.\n\nWhich conclusion is best supported by the text?","ch":["Short study sessions are more enjoyable than long ones.","Studying the night before an exam is never effective.","Students should study for no more than two weeks.","Spreading study time over several sessions can improve long-term retention."],"ans":3},{"sec":"math","mod":1,"type":"open","text":"If 3x + 5 = 20, what is the value of x?","ans":["5"]},{"sec":"math","mod":1,"type":"mc","text":"The function f is defined by f(x) = x^{2} - 2x + 1. What is the value of f(3)?","ch":["2","4","6","8"],"ans":1},{"sec":"math","mod":1,"type":"mc","text":"A circle has a radius of 5. What is the area of the circle?","ch":["5\\pi","10\\pi","25\\pi","50\\pi"],"ans":2},{"sec":"math","mod":1,"type":"open","text":"A jacket originally priced at $80 is on sale for 25% off. What is the sale price, in dollars?","ans":["60"]},{"sec":"math","mod":2,"type":"mc","text":"Which of the following is a solution to the equation x^{2} - 5x + 6 = 0?","ch":["1","2","4","6"],"ans":1},{"sec":"math","mod":2,"type":"open","text":"x + y = 10 and x - y = 4. What is the value of x?","ans":["7"]},{"sec":"math","mod":2,"type":"open","text":"\\sqrt{x + 7} = 4. What is the value of x?","ans":["9"]},{"sec":"math","mod":2,"type":"mc","text":"A right triangle has legs of length 6 and 8. What is the length of its hypotenuse?","ch":["9","10","12","14"],"ans":1}]};
if((db.seedv||0)<3){[['admin','admin'],['s1','student'],['e1','examinee']].forEach(([id,role])=>{const u=db.users.find(x=>x.id.toLowerCase()==id);if(u){u.pw='1';u.role=role}else db.users.push({id,pw:'1',role,uid:rnd()})});if(!db.tests.some(t=>t.id=='mock1'))db.tests.push(JSON.parse(JSON.stringify(SEED)));db.seedv=3}
function save(){if(SRV){if(me&&me.role=='admin')api('/api/admin/save',{users:db.users,tests:db.tests}).then(()=>db.users.forEach(u=>u.pw='')).catch(e=>alert('Could not save to the server: '+e));return}try{const s=JSON.parse(localStorage.getItem('satdb')||'{}');(s.results||[]).forEach(r=>{if(!db.results.some(x=>x.d==r.d&&x.u==r.u))db.results.push(r)});db.results.sort((a,b)=>a.d-b.d);localStorage.setItem('satdb',JSON.stringify(db));stOK=true}catch(e){stOK=false}}
save();
function setTheme(v){try{localStorage.setItem('satth',v)}catch(e){}if(v=='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',v)}
let sv='system';try{sv=localStorage.getItem('satth')||'system'}catch(e){}$('th').value=sv;setTheme(sv);
async function api(p,b){const r=await fetch(p,{method:'POST',headers:{'content-type':'application/json','x-token':TOK},body:JSON.stringify(b||{})});const j=await r.json().catch(()=>({}));if(r.status==401&&j.error=='auth'&&TOK){TOK='';me=null;T=null;hideFloat();render();alert('Your session expired. Please sign in again.');throw 'session'}if(!r.ok)throw j.error||'error';return j}
async function load(){const j=await api('/api/state');db.users=j.users||[];db.tests=j.tests||[];db.results=j.results||[]}
function ask(m,fn,ok){window._f=fn;$('mod').innerHTML=`<div class=card style="max-width:380px;margin:0"><p style="white-space:pre-line">${esc(m)}</p><div class=row><button class=g onclick="mod.style.display='none'">Cancel</button><button onclick="mod.style.display='none';window._f()">${ok||'Confirm'}</button></div></div>`;$('mod').style.display='grid'}
window.alert=m=>{$('mod').innerHTML=`<div class=card style="max-width:380px;margin:0"><p style="white-space:pre-line">${esc(m)}</p><button onclick="mod.style.display='none'">OK</button></div>`;$('mod').style.display='grid'};
const ordQ=t=>{const o=[];for(const c of['english','math'])for(const m of[1,2])o.push(...t.qs.filter(q=>q.sec==c&&Math.min(q.mod||1,t.mods||1)==m));return o};
function mkMods(){const mm=[];T.qs.forEach((q,k)=>{const m=Math.min(q.mod||1,T.t.mods||1),l=mm.find(x=>x.sec==q.sec&&x.mod==m);if(l)l.idx.push(k);else mm.push({sec:q.sec,mod:m,idx:[k]})});T.ms=mm;T.cm=null;T.done={};T.f={};T.hl={};T.rv=false;T.aid=rnd();T.i=0}
function pickImg(inp,cb){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/im.width),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.85))};im.onerror=()=>alert('Could not read that image.');im.src=r.result};r.readAsDataURL(f)}
function impUI(){$('mod').innerHTML=`<div class=card style="max-width:420px;margin:0"><h3>Import data</h3><textarea id=imp placeholder="Paste exported text here"></textarea><div class=row><button class=g onclick="mod.style.display='none'">Cancel</button><button onclick="impDo()">Import</button></div></div>`;$('mod').style.display='grid'}
function impDo(){try{const d=JSON.parse($('imp').value);if(!Array.isArray(d.users)||!Array.isArray(d.tests))throw 0;db.users=d.users;db.tests=d.tests;db.users.forEach(u=>u.role=u.role||'student');if(!db.users.some(u=>u.role=='admin'))db.users.push({id:'admin',pw:'admin123',role:'admin'});save();mod.style.display='none';alert('Imported '+db.users.length+' accounts and '+db.tests.length+' tests.')}catch(e){alert('That text is not valid exported data.')}}
const SYM={pi:'π',theta:'θ',le:'≤',ge:'≥',ne:'≠',pm:'±',times:'×',div:'÷',cdot:'·',infty:'∞',degree:'°',alpha:'α',beta:'β',ell:'ℓ'};
function M(s){let i=0;
 function grp(){if(s[i]=='{'){let d=1,j=i+1;while(j<s.length&&d){if(s[j]=='{')d++;if(s[j]=='}')d--;j++}const r=s.slice(i+1,d?j:j-1);i=j;return M(r)}return esc(s[i++]||'')}
 let o='';while(i<s.length){
  if(s.startsWith('\\sqrt',i)){i+=5;o+='√<span class=rt>'+grp()+'</span>'}
  else if(s.startsWith('\\frac',i)){i+=5;const a=grp(),b=grp();o+=`<span class=fr><span>${a}</span><span>${b}</span></span>`}
  else if(s[i]=='^'){i++;o+='<sup>'+grp()+'</sup>'}
  else if(s[i]=='_'){i++;o+='<sub>'+grp()+'</sub>'}
  else if(s[i]=='\\'){const m=s.slice(i).match(/^\\([a-zA-Z]+)/);if(m&&SYM[m[1]]){o+=SYM[m[1]];i+=m[0].length}else o+=esc(s[i++])}
  else if(s[i]=='\n'){o+='<br>';i++}else o+=esc(s[i++])}
 return o}
function ins(t){if(!focusEl)return;const e=focusEl,a=e.selectionStart;e.setRangeText(t,a,e.selectionEnd,'end');e.focus();prev();rprev()}
const TB=[['x²','^{2}'],['xⁿ','^{}'],['xₙ','_{}'],['√','\\sqrt{}'],['a/b','\\frac{}{}'],['π','\\pi '],['≤','\\le '],['≥','\\ge '],['±','\\pm '],['°','\\degree '],['×','\\times ']];
const toolbar=()=>'<div class=tb>'+TB.map(([l,t])=>`<button type=button class=g onmousedown="event.preventDefault()" onclick="ins('${t.replace(/\\/g,'\\\\')}')">${l}</button>`).join('')+'</div>';
const K=()=>+(document.querySelector('input[name=ca]:checked')||{value:-1}).value;
const nav=async t=>{tab=t;eq=null;qImg='';view=null;refEdit=null;ue=null;te=null;if(SRV&&t=='res'){try{await load()}catch(e){}}render()};
async function login(){const u=$('lu').value.trim(),p=$('lp').value.trim();
 if(!SRV){try{const r=await fetch('/api/ping');SRV=r.ok&&(await r.json()).ok===1}catch(e){}}
 if(SRV){try{const j=await api('/api/login',{id:u,pw:p});TOK=j.token;me=j.user;await load();tab='tests';view=null;render()}catch(e){$('le').textContent=e=='locked'?'Too many attempts. Try again later.':'Wrong ID or password'}return}
 const x=db.users.find(x=>x.id.toLowerCase()==u.toLowerCase()&&x.pw.trim()==p);if(!x)return $('le').textContent=db.users.some(y=>y.id.toLowerCase()==u.toLowerCase())?'Wrong password.':'No account with this ID exists in this browser (preview mode keeps accounts only on this device).';
 me={id:x.id,role:x.role,uid:x.uid};tab='tests';view=null;render()}
function out(){me=null;T=null;view=null;hideFloat();render()}
function render(){
 $('who').innerHTML=me?`${esc(me.id)} <span style="opacity:.8">(${me.role})</span> <button onclick="out()">Log out</button>`:'';
 if(!me)return $('app').innerHTML=`<div class=card style="max-width:380px;margin:40px auto"><h2>Sign in</h2><label>ID</label><input id=lu><label>Password</label><input id=lp type=password onkeydown="event.key=='Enter'&&login()"><p id=le style="color:var(--er)"></p><button onclick="login()">Sign in</button><p class=mu>${SRV?'':'🟡 Preview mode: data stays in this browser only.'}</p>${SRV?'':'<p class=mu>Preview accounts: admin / 1 · s1 / 1 · e1 / 1</p>'}</div>`;
 if(me.role=='admin')return admin();T?test():student()}
// ---------- RESULT DETAILS ----------
function detail(r){const L=g=>g==null?null:typeof g=='number'?'ABCD'[g]:g,cnt={};return `<div class=card><h3>${esc(r.t)} — ${esc(nm(r))}</h3><p class=mu>${new Date(r.d).toLocaleString()} · English ${r.e} · Math ${r.m} · left the window ${r.v}×</p></div>${r.mm?`<div class=card><h3>Correct answers per module</h3><table><tr><th>Module</th><th>Correct</th></tr>${r.mm.map(x=>`<tr><td>${x.sec=='math'?'Math':'English'} – Module ${x.mod}</td><td><b>${x.c}/${x.n}</b></td></tr>`).join('')}</table></div>`:''}<div class=card><table><tr><th>Module</th><th>Question</th><th>Chosen</th><th>Correct answer</th><th></th></tr>${[...(r.items||[])].sort((a,b)=>(a.n||0)-(b.n||0)).map(q=>{const kk=q.sec+(q.mod||''),j=cnt[kk]=(cnt[kk]||0)+1;return `<tr><td>${q.sec=='math'?'Math':'English'}${q.mod?' · M'+q.mod:''}</td><td>${j}</td><td><b>${q.g==null?'<span class=mu>no answer</span>':esc(L(q.g))}</b></td><td>${q.c==null?'—':esc(L(q.c))}</td><td>${q.ok?'<b style="color:var(--ok)">✓</b>':'<b style="color:var(--er)">✗</b>'}</td></tr>`}).join('')||'<tr><td colspan=5 class=mu>No answers were recorded for this attempt.</td></tr>'}</table></div>`}
// ---------- ADMIN ----------
function admin(){
 const tabs=[['tests','Create test'],['qs','Add questions'],['users','Accounts'],['res','Results']];
 let h=(stOK?'':'<div class=card style="border-color:var(--er)">⚠ This browser is blocking storage; data will be lost on reload.</div>')+'<div class=tabs>'+tabs.map(([k,l])=>`<button class="${tab==k?'on':''}" onclick="nav('${k}')">${l}</button>`).join('')+'</div>';
 if(view!=null){const r=db.results.find(x=>x.d==view);$('app').innerHTML=h+'<button class=g onclick="view=null;render()">← Back to results</button><br><br>'+(r?detail(r):'');return}
 if(tab=='tests'){h+=`<div class=card><h3>New test</h3><div class=row><div><label>Title</label><input id=tt placeholder="Full Mock Test 1"></div><div><label>Type</label><select id=ty><option>Full mock test</option><option>Level test – Level 1</option><option>Level test – Level 2</option><option>Level test – Level 3</option><option>Level test – Level 4</option></select></div><div><label>Modules per section</label><select id=tm><option value=1>1 module</option><option value=2>2 modules</option></select></div><div><label>Test password</label><input id=tp></div></div><div class=row><div><label>English time limit (min, per module)</label><input id=tl1 type=number min=0 placeholder="no limit"></div><div><label>Math time limit (min, per module)</label><input id=tl2 type=number min=0 placeholder="no limit"></div></div><button onclick="addTest()">Create test</button></div>`;
  if(te!=null){const t=db.tests[te];h+=`<div class=card><h3>Edit test</h3><div class=row><div><label>Test name</label><input id=et value="${esc(t.title)}"></div><div><label>Type</label><select id=ey>${['Full mock test','Level test – Level 1','Level test – Level 2','Level test – Level 3','Level test – Level 4'].map(x=>`<option ${x==t.type?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Test password</label><input id=ep2 value="${esc(t.pw)}"></div></div><div class=row><div><label>Modules per section</label><select id=em><option value=1 ${(t.mods||1)==1?'selected':''}>1 module</option><option value=2 ${t.mods==2?'selected':''}>2 modules</option></select></div><div><label>English time limit (min, per module)</label><input id=el type=number min=0 value="${t.tEn||''}" placeholder="no limit"></div><div><label>Math time limit (min, per module)</label><input id=ml type=number min=0 value="${t.tMa||''}" placeholder="no limit"></div></div><button onclick="saveT()">Save</button> <button class=g onclick="te=null;render()">Cancel</button></div>`}
  if(refEdit!=null){const t=db.tests[refEdit];h+=`<div class=card><h3>Reference sheet – ${esc(t.title)}</h3><p class=mu>Optional: replaces the default Bluebook-style reference sheet for this test only. Use the same math buttons; new lines work.</p>${toolbar()}<textarea id=rf oninput="rprev()" onfocus="focusEl=this" style="min-height:150px" placeholder="Area of a circle: A = \\pi r^{2}">${esc(t.ref||'')}</textarea><label>Reference image (optional)</label><input type=file accept="image/*" onchange="pickImg(this,d=>{rImg=d;rprev()})"> <button class=g onclick="rImg='';rprev()">Remove image</button><div class=pv id=rpv></div><br><button onclick="saveRef()">Save</button> <button class=g onclick="refEdit=null;render()">Cancel</button> ${t.ref||t.refImg?'<button class=d onclick="saveRef(1)">Remove reference sheet</button>':''}</div>`}
  h+=`<div class=card><h3>Tests</h3><table>${db.tests.map((t,i)=>`<tr><td><b>${esc(t.title)}</b> ${t.ref||t.refImg?'<span class=tag>📐 custom reference</span>':''}<br><span class=mu>${esc(t.type)} · ${t.qs.length} questions · ${t.mods||1} module${(t.mods||1)>1?'s':''} per section${t.tEn?' · English '+t.tEn+' min':''}${t.tMa?' · Math '+t.tMa+' min':''}</span></td><td>Password: <b>${esc(t.pw)}</b></td><td><button class=g onclick="te=${i};render();scrollTo(0,0)">✎ Edit</button> <button class=g onclick="refEdit=${i};rImg=db.tests[${i}].refImg||'';render()">📐 Custom reference</button> <button class=d onclick="ask('Delete this test?',()=>{db.tests.splice(${i},1);eq=null;save();render()},'Delete')">Delete</button></td></tr>`).join('')||'<tr><td class=mu>No tests yet.</td></tr>'}</table></div>`}
 if(tab=='qs'){if(!db.tests.length)h+='<div class=card>Create a test first.</div>';else{
  const ti=+(qTest??0),t=db.tests[ti]||db.tests[0],n2=t.mods||1,inM=(q)=>q.sec==qSec&&Math.min(q.mod||1,n2)==qMod;if(qMod>n2)qMod=1;
  const cnt=(c,m)=>t.qs.filter(q=>q.sec==c&&Math.min(q.mod||1,n2)==m).length;
  const tiles=['english','math'].flatMap(c=>[1,2].filter(m=>m<=n2).map(m=>`<div class="tl ${qSec==c&&qMod==m?'on':''}" onclick="qSec='${c}';qMod=${m};eq=null;qImg='';render()"><div class=mu>${c=='math'?'Math':'English'}</div><b>Module ${m}</b><div class=mu>${cnt(c,m)} questions</div></div>`)).join('');
  const where=(qSec=='math'?'Math':'English')+' · Module '+qMod;
  h+=`<div class=card><div class=row><div><label>Test</label><select onchange="qTest=this.value;qMod=1;eq=null;qImg='';render()">${db.tests.map((x,i)=>`<option value=${i} ${i==ti?'selected':''}>${esc(x.title)}</option>`).join('')}</select></div></div><p class=mu style="margin:6px 0 10px">1. Choose where the questions go. The choice stays while you add as many questions as you like.</p><div class=mgrid>${tiles}</div></div>
  <div class=card><h3>2. ${eq!=null?'Edit question':'Add question'} → ${where}</h3>${flash?`<p style="color:var(--ok);margin:0 0 8px"><b>${flash}</b></p>`:''}<div class=row><div><label>Answer format</label><select id=qt onchange="fmt()"><option value=mc>Multiple choice</option><option value=open>Open answer</option></select></div></div>
  <label>Question (use the buttons for powers, roots, fractions)</label>${toolbar()}<textarea id=qx oninput="prev()" onfocus="focusEl=this"></textarea><label>Image (optional — graph, figure, table)</label><input type=file accept="image/*" onchange="pickImg(this,d=>{qImg=d;prev()})"> <button class=g onclick="qImg='';prev()">Remove image</button>
  <div id=mc><label>Answer choices — tick the circle next to the correct one</label>${'ABCD'.split('').map((l,i)=>`<div style="display:flex;gap:8px;align-items:center"><input type=radio name=ca value=${i} ${i==0?'checked':''} onchange="prev()" style="width:auto;margin:0"><b>${l}</b><input class=cc id=c${i} oninput="prev()" onfocus="focusEl=this" placeholder="Choice ${l}"></div>`).join('')}</div>
  <div id=op style="display:none"><label>Correct answer (type it; separate accepted alternatives with ;)</label><input id=oa oninput="prev()" placeholder="e.g. 3/2; 1.5"></div>
  <h3>Live preview</h3><div class=pv id=pv></div><br><button onclick="addQ()">${eq!=null?'Save changes':'Add question'}</button>${eq!=null?' <button class=g onclick="eq=null;qImg=\'\';render()">Cancel</button>':''}</div>
  <div class=card><h3>Questions in ${where} (${cnt(qSec,qMod)})</h3>${t.qs.map((q,i)=>inM(q)?`<div style="border-bottom:1px solid var(--bd);padding:8px 0"><span class=mu>${q.type}</span> <span style="float:right"><button class=g onclick="eq=${i};render();scrollTo(0,0)">Edit</button> <button class=g onclick="eq=null;db.tests[${ti}].qs.splice(${i},1);save();render()">Remove</button></span><div>${M(q.text)}${q.img?' <span class=tag>🖼 image</span>':''}</div></div>`:'').join('')||'<span class=mu>None yet.</span>'}</div>`}}

 if(!r){r={aid:T.aid,uid:me.uid,u:me.id,role:me.role,t:T.t.title,e:'—',m:'—',v:0,d:Date.now(),items:[],mm:[],done:[]};db.results.push(r)}
 let c=0;m.idx.forEach(k=>{const q=T.qs[k],a=T.a[k],ok=q.type=='mc'?a===q.ans:a!=null&&q.ans.some(x=>norm(x)==norm(a));if(ok)c++;r.items.push({sec:q.sec,mod:m.mod,type:q.type,g:a==null||a===''?null:a,c:q.type=='mc'?q.ans:q.ans.join(' ; '),ok:!!ok,n:k})});
 r.mm.push({sec:m.sec,mod:m.mod,c,n:m.idx.length});r.done.push(mk);r.v=Math.max(r.v,T.v);
 ['english','math'].forEach((sc,i)=>{const t=r.mm.filter(x=>x.sec==sc);if(t.length)r[i?'m':'e']=t.reduce((a,x)=>a+x.c,0)+'/'+t.reduce((a,x)=>a+x.n,0)});save()}
async function subMod(){clearInterval(T.iv);T.end=0;const m=T.ms[T.cm],mk=m.sec+m.mod;
 try{if(SRV)await api('/api/submit',{id:T.t.id,aid:T.aid,mk,a:T.a,v:T.v});else recLocal(m)}catch(e){return alert(e=='done'?'This module was already submitted.':'Could not submit: '+e)}
 T.done[mk]=true;T.cm=null;T.rv=false;
 if(T.ms.every(x=>T.done[x.sec+x.mod]))return endTest(true);
 test()}
async function endTest(all){if(T)clearInterval(T.iv);T=null;hideFloat();try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}if(SRV&&me.role!='admin'){try{await load()}catch(e){}}view=null;render();alert(all?'Test completed. Your answers have been submitted.'+(me.role=='student'?' You can see your results in “My attempts”.':''):'You left the test.')}
function exitTest(){ask('Leave the test? Modules you have not submitted will not be recorded.',()=>endTest(false),'Leave')}
// ---------- ANTI-CHEAT (deterrents) ----------
function bad(){if(!T||Date.now()-lastBad<800)return;lastBad=Date.now();T.v++;cov.style.display='grid'}
document.addEventListener('visibilitychange',()=>document.hidden&&bad());
addEventListener('blur',()=>setTimeout(()=>{if(document.activeElement&&document.activeElement.tagName=='IFRAME')return;bad()},0));
document.addEventListener('contextmenu',e=>{if(T)e.preventDefault()});
['copy','cut','paste','dragstart'].forEach(ev=>document.addEventListener(ev,e=>{if(T&&e.target.tagName!='INPUT')e.preventDefault()}));
document.addEventListener('keydown',e=>{if(!T)return;if(e.key=='PrintScreen'||(e.ctrlKey||e.metaKey)&&'pscu'.includes(e.key.toLowerCase())||(e.metaKey&&e.shiftKey)||e.key=='F12'){e.preventDefault();try{navigator.clipboard.writeText('')}catch(_){}bad()}});
document.addEventListener('keyup',e=>{if(T&&e.key=='PrintScreen'){try{navigator.clipboard.writeText('')}catch(_){}bad()}});
addEventListener('beforeunload',e=>{if(T){e.preventDefault();e.returnValue=''}});
dragWin($('flc'),$('flch'));dragWin($('flr'),$('flrh'));
(async()=>{try{const r=await fetch('/api/ping');SRV=r.ok&&(await r.json()).ok===1}catch(e){}render()})();
</script></body></html>
